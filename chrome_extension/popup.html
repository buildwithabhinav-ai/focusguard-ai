
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusGuard AI Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      color: white;
      background: #4f46e5;
      font-size: 23px;
      font-weight: bold;
    }

    h1 {
      margin: 12px 0 5px;
      font-size: 21px;
    }

    .subtitle {
      margin: 0;
      color: #64748b;
      font-size: 13px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px #e0e7ff;
    }

    button {
      width: 100%;
      height: 43px;
      margin-top: 20px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 13px;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error { display: block; color: #b91c1c; }
    #message.success { display: block; color: #047857; }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">F</div>
    <h1>FocusGuard AI</h1>
    <p class="subtitle">Sign in to start tracking your focus</p>
  </div>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="username"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    />

    <button id="loginButton" type="submit">Login</button>
    <div id="message" role="status" aria-live="polite"></div>
  </form>

  <div class="footer">
    Human Attention Preservation Platform<br />
    Need help? <a href="mailto:support.focusguardai@gmail.com" target="_blank" rel="noreferrer">support.focusguardai@gmail.com</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
