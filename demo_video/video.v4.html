<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FocusGuard AI - demo video composition v2</title>
<style>
@font-face{font-family:Geist;font-weight:400;src:url(assets/fonts/geist-sans-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(assets/fonts/geist-sans-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(assets/fonts/geist-sans-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(assets/fonts/geist-sans-latin-700-normal.woff2)}
@font-face{font-family:Geist;font-weight:800;src:url(assets/fonts/geist-sans-latin-800-normal.woff2)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#050813;font-family:Geist,system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#050813 0%,#0c1030 52%,#171046 100%)}
.abs{position:absolute}
.blob{position:absolute;width:1000px;height:1000px;border-radius:50%;filter:blur(140px);opacity:.5;will-change:transform}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 72%)}
#fx{position:absolute;inset:0}
#fx2{position:absolute;inset:0;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;display:none;perspective:2600px;perspective-origin:50% 36%}
.aibg{position:absolute;inset:-70px;background-size:cover;background-position:center;opacity:0;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 85%)}
/* headline */
.head{position:absolute;left:140px;top:30px;width:1640px}
.kick{display:inline-flex;align-items:center;gap:14px;font-size:19px;font-weight:700;letter-spacing:.17em;color:#a5b4fc;text-transform:uppercase}
.kick .num{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 11px;border-radius:9px;background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;letter-spacing:.06em;font-size:17px;box-shadow:0 8px 24px rgba(99,102,241,.55)}
.kick i{display:block;width:44px;height:3px;border-radius:3px;background:linear-gradient(90deg,#818cf8,#c084fc)}
.ttl{position:relative;display:inline-block;font-size:64px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .14em;margin:0 .22em 0 0}
.wm>span{display:inline-block;will-change:transform}
.ul{position:absolute;left:0;bottom:-2px;height:5px;border-radius:3px;background:linear-gradient(90deg,#818cf8,#e879f9,#22d3ee);width:0;box-shadow:0 0 18px rgba(129,140,248,.9)}
.grad{background:linear-gradient(90deg,#a5b4fc,#e879f9,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
/* window mock */
.wglow{position:absolute;border-radius:40px;filter:blur(70px);opacity:0}
.win{position:absolute;border-radius:20px;overflow:hidden;background:#0b1020;box-shadow:0 60px 140px -20px rgba(0,0,0,.8),0 0 0 1.5px rgba(255,255,255,.14);transform-origin:50% 50%;will-change:transform}
.bar{height:44px;background:linear-gradient(#1c2142,#161a39);display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar b{width:13px;height:13px;border-radius:50%;display:block}
.url{margin-left:22px;flex:0 0 520px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);color:#aab1d6;font-size:14px;display:flex;align-items:center;padding:0 14px}
.view{position:relative;overflow:hidden;background:#f8fafc}
.view img{position:absolute;display:block;max-width:none}
.sweep{position:absolute;top:-20%;width:300px;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(16deg);opacity:0;pointer-events:none}
.spot{position:absolute;border-radius:18px;border:3px solid rgba(165,180,252,.95);box-shadow:0 0 0 4000px rgba(7,10,30,.6),0 0 46px 6px rgba(129,140,248,.85),inset 0 0 30px rgba(129,140,248,.35);opacity:0;pointer-events:none}
.spotl{position:absolute;padding:7px 15px;border-radius:999px;background:linear-gradient(135deg,#4f46e5,#9333ea);font-size:19px;font-weight:700;color:#fff;white-space:nowrap;opacity:0;box-shadow:0 10px 30px rgba(79,70,229,.6)}
.cur{position:absolute;width:34px;height:34px;left:0;top:0;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transform-origin:4px 3px}
.rip{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid #6366f1;opacity:0}
/* chips + glass cards */
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 24px 12px 12px;border-radius:999px;background:rgba(255,255,255,.96);color:#111633;font-size:23px;font-weight:700;box-shadow:0 18px 50px -10px rgba(0,0,0,.55),0 0 0 1px rgba(99,102,241,.25);opacity:0;white-space:nowrap}
.chip .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.chip.green .ic{background:linear-gradient(135deg,#16a34a,#22c55e)}
.chip.dark{background:rgba(15,19,48,.94);color:#fff;box-shadow:0 18px 50px -10px rgba(0,0,0,.6),0 0 0 1px rgba(165,180,252,.4)}
.glass{position:absolute;border-radius:26px;background:linear-gradient(150deg,rgba(38,42,104,.92),rgba(16,20,58,.9));border:1px solid rgba(165,180,252,.4);backdrop-filter:blur(14px);box-shadow:0 30px 80px -20px rgba(0,0,0,.75),0 0 40px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.3);opacity:0;padding:20px 28px;transform-style:preserve-3d}
.glass.sc{padding:14px 24px;border-radius:22px}
.glass.sc .vl{font-size:54px}
.glass.sc .lb{font-size:18px}
.glass .lb{font-size:19px;font-weight:600;color:#c7d2fe;letter-spacing:.02em}
.glass .vl{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.glass .bar2{height:7px;border-radius:5px;background:rgba(255,255,255,.14);margin-top:12px;overflow:hidden}
.glass .bar2 i{display:block;height:100%;border-radius:5px;width:0}
.pill{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;font-size:24px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#e0e7ff;opacity:0;white-space:nowrap;backdrop-filter:blur(6px)}
.logo{position:absolute;width:150px;height:150px;border-radius:38px;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3);display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;box-shadow:0 30px 100px -10px rgba(99,102,241,.9),inset 0 0 0 2px rgba(255,255,255,.28);overflow:hidden}
.logo:after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(18deg);animation:none}
.big{font-size:108px;font-weight:800;letter-spacing:-.04em}
.mid{font-size:70px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:38px;font-weight:500;color:#c7d2fe}
.center{position:absolute;left:0;right:0;text-align:center}
.letter{display:inline-block;transform-origin:50% 100%}
.rolecard{width:500px;height:450px;padding:34px 36px}
.rolecard h3{font-size:38px;margin:18px 0 14px;font-weight:800;letter-spacing:-.02em}
.rolecard li{font-size:25px;color:#dbe1ff;margin:12px 0;list-style:none;padding-left:34px;position:relative;opacity:0}
.rolecard li:before{content:"";position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#86efac);box-shadow:0 0 14px rgba(34,197,94,.7)}
.ricon{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.feed{position:absolute;display:flex;align-items:center;gap:18px;padding:18px 26px;border-radius:22px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);font-size:30px;font-weight:600;opacity:0}
.feed small{margin-left:auto;font-size:20px;color:#a5b4fc;font-weight:500}
.feed .dot{width:16px;height:16px;border-radius:50%;background:#34d399;box-shadow:0 0 16px #34d399}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(1,3,12,.62) 100%)}
#grain{position:absolute;inset:-120px;pointer-events:none;opacity:.075;mix-blend-mode:overlay}
#progress{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#6366f1,#c084fc,#22d3ee);width:0;box-shadow:0 0 14px rgba(129,140,248,.9)}
#wm{position:absolute;right:46px;bottom:26px;font-size:20px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em;opacity:0}
#wipe{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.band{position:absolute;top:-200px;height:1500px;transform:skewX(-16deg);will-change:transform}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="background:#4f46e5"></div>
  <div class="blob" id="b2" style="background:#9333ea"></div>
  <div class="blob" id="b3" style="background:#0ea5e9;opacity:.32"></div>
  <div id="grid"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <canvas id="fx2" width="1920" height="1080"></canvas>
  <div id="wipe"><div class="band" id="band1"></div><div class="band" id="band2"></div></div>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="wm">FocusGuard AI</div>
  <div id="progress"></div>
  <div id="black"></div>
</div>
<script>
const W=1920,H=1080;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,out:t=>1-Math.pow(1-t,3),out5:t=>1-Math.pow(1-t,5),in:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},soft:t=>t*t*(3-2*t),exp:t=>t>=1?1:1-Math.pow(2,-10*t)};
const PR=(t,t0,d,e=E.out)=>e(clamp((t-t0)/d));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const updaters=[];const T={};let CLICKS=[],HITS=[];
const WIN={x:140,y:176,w:1640,h:796,bar:44};
const ICON={
  bolt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="2" width="4" height="19" rx="1"/></svg>',
  mail:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  user:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c.8-4.6 4.2-7 8.5-7s7.7 2.4 8.5 7z"/></svg>',
  moon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>',
  sparkle:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/></svg>',
  phone:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  shield:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>',
  building:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6h5a1 1 0 0 1 1 1v10zM7 7h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm6 0h2v2h-2z"/></svg>'
};
const CURSOR='<svg viewBox="0 0 34 34" width="34" height="34"><path d="M4 3v22l6-5.4 4.2 9.6 4-1.8-4.2-9.4H22z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>';

/* ---------- optional AI backgrounds (Higgsfield images dropped into assets/ai/) ---------- */
const AIBG={};
const AI_NAMES=['intro','problem','showcase','employee','analytics','ai','extension','superadmin','subadmin','roles','outro'];
function tryImage(name){return new Promise(res=>{const i=new Image();i.onload=()=>{AIBG[name]=i.src;res()};i.onerror=()=>res();i.src='assets/ai/'+name+'.jpg'})}
function aiLayer(scene,name){const d=el('div','aibg','',scene);d.dataset.ai=name;scene.insertBefore(d,scene.firstChild);return d}
function updAI(d,t,start,dur,{op=.5,blur=0}={}){if(!AIBG[d.dataset.ai]){d.style.display='none';return}d.style.display='block';d.style.backgroundImage='url('+AIBG[d.dataset.ai]+')';
  const lt=t-start;d.style.opacity=op*PR(t,start,1)*(1-PR(t,start+dur-1,1));d.style.filter=blur?`blur(${blur}px) saturate(1.15)`:'saturate(1.15)';
  d.style.transform=`scale(${1.06+0.07*lt/dur}) translate(${Math.sin(t*.3)*-18}px,${-lt*3}px)`}

/* ---------- global background + fx canvas ---------- */
const bl=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')];
const fx=document.getElementById('fx').getContext('2d');const fx2=document.getElementById('fx2').getContext('2d');
const rngP=mulberry(7);const PARTS=Array.from({length:90},()=>({x:rngP()*W,y:rngP()*H,r:1+rngP()*3,s:8+rngP()*30,p:rngP()*6.28,a:.12+rngP()*.45,z:rngP()}));
// light streaks
const STREAKS=Array.from({length:7},(_,i)=>({y:120+i*140+rngP()*60,s:300+rngP()*500,len:260+rngP()*420,p:rngP()*3000,a:.05+rngP()*.07}));
function drawBg(t){
  bl[0].style.transform=`translate(${-320+Math.sin(t*.21)*280}px,${-400+Math.cos(t*.17)*170}px)`;
  bl[1].style.transform=`translate(${950+Math.cos(t*.19)*260}px,${260+Math.sin(t*.23)*210}px)`;
  bl[2].style.transform=`translate(${420+Math.sin(t*.13+2)*320}px,${620+Math.cos(t*.15)*130}px)`;
  fx.clearRect(0,0,W,H);fx2.clearRect(0,0,W,H);
  // soft light streaks
  for(const s of STREAKS){const x=((s.p+t*s.s)%(W+s.len*2))-s.len;const g=fx.createLinearGradient(x,0,x+s.len,0);g.addColorStop(0,'rgba(165,180,252,0)');g.addColorStop(.5,`rgba(165,180,252,${s.a})`);g.addColorStop(1,'rgba(165,180,252,0)');fx.fillStyle=g;fx.fillRect(x,s.y,s.len,2)}
  for(const p of PARTS){const y=(p.y-t*p.s*(.5+p.z)+H*10)%H;const x=p.x+Math.sin(t*.4+p.p)*28;fx.globalAlpha=p.a*(.55+.45*Math.sin(t*1.3+p.p));fx.fillStyle=p.z>.7?'#f0abfc':'#c7d2fe';fx.beginPath();fx.arc(x,y,p.r*(.6+p.z*.8),0,6.283);fx.fill()}
  fx.globalAlpha=1;
}
// film grain tile
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);const r=mulberry(99);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')'})();

/* ---------- helpers ---------- */
function Scene(name,{fadeIn=.6,fadeOut=.6,push=true}={}){
  const s=T[name];const root=el('div','scene','',document.getElementById('scenes'));
  updaters.push(t=>{const pin=fadeIn?PR(t,s.start,fadeIn,E.lin):(t>=s.start?1:0);const pout=fadeOut?PR(t,s.start+s.dur-fadeOut,fadeOut,E.lin):(t<s.start+s.dur?0:1);
    root.style.opacity=pin*(1-pout);root.style.display=(t>=s.start-.01&&t<=s.start+s.dur+.01)?'block':'none';
    if(push)root.style.transform=`scale(${1+.035*(1-E.out(pin))+.03*pout})`});
  return {root,s};
}
function maskWords(parent,text,cls=''){return text.split(' ').map(w=>{const m=el('span','wm','',parent);return el('span',cls,w,m)})}
function Headline(scene,start,dur,kicker,title,num,{out=true}={}){
  const h=el('div','head','',scene.root);const hend=out?.5:.9;
  const k=el('div','kick',(num?`<span class="num">${num}</span>`:'')+'<i></i>'+kicker,h);k.style.display='flex';
  const wrap=el('div','',null,h);wrap.style.cssText='position:relative;display:inline-block';
  const tt=el('div','ttl','',wrap);const ws=maskWords(tt,title);const ul=el('div','ul','',tt);
  updaters.push(t=>{const vis=t>=start-.01&&t<=start+dur+.6;h.style.display=vis?'block':'none';if(!vis)return;
    h.style.opacity=1-PR(t,start+dur-hend,.4,E.lin);
    const pk=PR(t,start+.1,.6);k.style.opacity=pk;k.style.transform=`translateX(${(1-pk)*-30}px)`;
    ws.forEach((w,i)=>{const p=PR(t,start+.25+i*.1,.75,E.out5);w.style.transform=`translateY(${(1-p)*118}%)`});
    const pu=PR(t,start+.6+ws.length*.1,.8,E.io);ul.style.width=(tt.offsetWidth*pu)+'px';ul.style.opacity=1-PR(t,start+dur-hend,.3,E.lin)});
}
function Chip(scene,{text,icon='check',x,y,t0,t1,cls='',float=1}){
  const c=el('div','chip '+cls,`<span class="ic">${ICON[icon]}</span>${text}`,scene.root);c.style.left=x+'px';c.style.top=y+'px';
  updaters.push(t=>{const p=PR(t,t0,.6,E.back)*(1-PR(t,t1,.35,E.lin));c.style.opacity=clamp(p*1.4);c.style.display=t>=t0-.01&&t<=t1+.4?'flex':'none';c.style.transform=`translateY(${Math.sin(t*2.2+x)*5*float}px) scale(${.6+.4*p})`});return c}
function StatCard(scene,{label,value,suffix='',decimals=0,x,y,w=330,t0,t1,color='#818cf8',bar=null,fromX=90}){
  const g=el('div','glass sc',`<div class="lb">${label}</div><div class="vl"><span class="n">0</span>${suffix}</div>${bar!=null?`<div class="bar2"><i style="background:${color};box-shadow:0 0 14px ${color}"></i></div>`:''}`,scene.root);
  g.style.left=x+'px';g.style.top=y+'px';g.style.width=w+'px';const n=g.querySelector('.n'),b=g.querySelector('.bar2 i');
  updaters.push(t=>{const vis=t>=t0-.01&&t<=t1+.5;g.style.display=vis?'block':'none';if(!vis)return;
    const p=PR(t,t0,.8,E.back),o=1-PR(t,t1,.4,E.lin);g.style.opacity=clamp(p*1.5)*o;
    g.style.transform=`translate3d(${(1-p)*fromX}px,${Math.sin(t*1.9+x)*6}px,${(1-p)*-160}px) rotateY(${(1-p)*-32}deg) scale(${.85+.15*p})`;
    const c=PR(t,t0+.25,1.1,E.out);n.textContent=(value*c).toFixed(decimals);if(b)b.style.width=(bar*c)+'%'});return g}

/* ---------- app window shot ---------- */
function Shot(scene,cfg){
  const glow=el('div','wglow','',scene.root);glow.style.cssText+=`left:${WIN.x-20}px;top:${WIN.y-10}px;width:${WIN.w+40}px;height:${WIN.h+WIN.bar+30}px;background:${cfg.glow||'radial-gradient(ellipse,#4f46e5,#9333ea 55%,transparent 80%)'}`;
  const win=el('div','win','',scene.root);
  win.style.left=WIN.x+'px';win.style.top=WIN.y+'px';win.style.width=WIN.w+'px';win.style.height=(WIN.h+WIN.bar)+'px';

  const cur=el('div','cur',CURSOR,view);const sweep=el('div','sweep','',view);
  const rips=(cfg.cursor||[]).filter(k=>k.click).map(k=>({r:el('div','rip','',view),k}));
  const imgW=1440;
  function cam(lt){const K=cfg.cam;if(lt<=K[0].t)return K[0];for(let i=0;i<K.length-1;i++){if(lt<=K[i+1].t){const p=E.io(clamp((lt-K[i].t)/(K[i+1].t-K[i].t)));return {fx:lerp(K[i].fx,K[i+1].fx,p),fy:lerp(K[i].fy,K[i+1].fy,p),Z:lerp(K[i].Z,K[i+1].Z,p)}}}return K[K.length-1]}
  if(cfg.head!==false)Headline(scene,cfg.start,cfg.dur,cfg.kicker,cfg.title,cfg.num,{out:cfg.out!==false});
  updaters.push(t=>{
    const lt=t-cfg.start;const vis=lt>=-.01&&lt<=cfg.dur+.7;win.style.display=vis?'block':'none';glow.style.display=vis?'block':'none';if(!vis)return;
    const pin=PR(t,cfg.start+.05,.95,E.out5);const pout=cfg.out===false?0:PR(t,cfg.start+cfg.dur-.5,.5,E.lin);
    win.style.opacity=clamp(pin*1.6)*(1-pout);glow.style.opacity=.34*pin*(1-pout);
    let tx=0,ty=(1-pin)*60,sc=1;
    if(cfg.extra){const r=cfg.extra(t,lt);if(r){tx=r.tx||0;ty+=r.ty||0;sc*=r.sc||1}}
    const ry=(1-pin)*-17+Math.sin(t*.55+cfg.start)*.7,rx=(1-pin)*8+Math.cos(t*.42)*.45;
    win.style.transform=`translate3d(${tx}px,${ty}px,${(1-pin)*-320}px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${sc*(.96+.04*pin)})`;
    glow.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
    const c=cam(lt);const iw=imgW*c.Z;
    const left=clamp(WIN.w/2-c.fx*c.Z,WIN.w-iw,0);const top=clamp(WIN.h/2-c.fy*c.Z,WIN.h-cfg.imgH*c.Z,0);
    img.style.width=iw+'px';img.style.left=left+'px';img.style.top=top+'px';
    // light sweep on entry
    const sp=PR(lt,.9,1.1,E.io);sweep.style.opacity=sp>0&&sp<1?.8:0;sweep.style.left=(lerp(-500,WIN.w+300,sp))+'px';
    // spotlights
    spots.forEach(({s,box,lab})=>{const a=PR(lt,s.t0,.55,E.back)*(1-PR(lt,s.t1,.4,E.lin));const on=lt>=s.t0-.01&&lt<=s.t1+.45;box.style.display=on?'block':'none';if(lab)lab.style.display=on?'block':'none';if(!on)return;
      const pad=10;const bx=left+(s.x)*c.Z-pad,by=top+(s.y)*c.Z-pad,bw=s.w*c.Z+pad*2,bh=s.h*c.Z+pad*2;
      box.style.opacity=clamp(a*1.4);box.style.left=bx+'px';box.style.top=by+'px';box.style.width=bw+'px';box.style.height=bh+'px';box.style.transform=`scale(${1.05-.05*clamp(a)})`;
      if(lab){lab.style.opacity=clamp(a*1.4);lab.style.left=clamp(bx+12,10,WIN.w-300)+'px';lab.style.top=clamp(by-18,10,WIN.h-50)+'px';lab.style.transform=`translateY(${(1-clamp(a))*14}px)`}});
    if(cfg.cursor){const K=cfg.cursor;let x,y;
      if(lt<K[0].t){x=K[0].x;y=K[0].y}else if(lt>=K[K.length-1].t){x=K[K.length-1].x;y=K[K.length-1].y}else{for(let i=0;i<K.length-1;i++)if(lt<=K[i+1].t){const p=E.io(clamp((lt-K[i].t)/(K[i+1].t-K[i].t)));x=lerp(K[i].x,K[i+1].x,p);y=lerp(K[i].y,K[i+1].y,p);break}}
      const v2=PR(lt,K[0].t-.3,.3,E.lin)*(1-PR(lt,K[K.length-1].t+.9,.4,E.lin));
      let press=1;rips.forEach(({k})=>{const d=lt-k.t;if(d>0&&d<.18)press=.84});
      cur.style.opacity=v2;cur.style.transform=`translate(${left+x*c.Z}px,${top+y*c.Z}px) scale(${press})`;
      rips.forEach(({r,k})=>{const d=lt-k.t;if(d>0&&d<.75){const p=d/.75;r.style.opacity=1-p;r.style.left=(left+k.x*c.Z)+'px';r.style.top=(top+k.y*c.Z)+'px';r.style.transform=`scale(${.4+p*2.2})`}else r.style.opacity=0})}
  });
  return win;
}

/* ---------- screen shake + flash helpers (driven by HITS) ---------- */
function shakeAt(t){let sx=0,sy=0,fl=0;for(const h of HITS){const d=t-h;if(d>=0&&d<.55){const k=Math.pow(1-d/.55,2);sx+=Math.sin(d*90)*14*k;sy+=Math.cos(d*77)*9*k;if(d<.18)fl=Math.max(fl,.28*(1-d/.18))}}return {sx,sy,fl}}
