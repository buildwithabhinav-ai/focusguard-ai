<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FocusGuard AI - demo video composition</title>
<style>
@font-face{font-family:Geist;font-weight:400;src:url(assets/fonts/geist-sans-latin-400-normal.woff2)}
@font-face{font-family:Geist;font-weight:500;src:url(assets/fonts/geist-sans-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(assets/fonts/geist-sans-latin-600-normal.woff2)}
@font-face{font-family:Geist;font-weight:700;src:url(assets/fonts/geist-sans-latin-700-normal.woff2)}
@font-face{font-family:Geist;font-weight:800;src:url(assets/fonts/geist-sans-latin-800-normal.woff2)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070b18;font-family:Geist,system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#070b18 0%,#0f1330 55%,#1a1245 100%)}
.abs{position:absolute}
.blob{position:absolute;width:980px;height:980px;border-radius:50%;filter:blur(130px);opacity:.55;will-change:transform}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
#fx{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;display:none}
.aibg{position:absolute;inset:-60px;background-size:cover;background-position:center;opacity:0}
/* headline */
.head{position:absolute;left:140px;top:38px;width:1640px}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.16em;color:#a5b4fc;text-transform:uppercase}
.kick i{display:block;width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,#818cf8,#c084fc)}
.ttl{font-size:58px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin-top:8px;white-space:nowrap}
.ttl .w{display:inline-block;margin-right:.26em}
.grad{background:linear-gradient(90deg,#a5b4fc,#e879f9,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
/* window mock */
.win{position:absolute;border-radius:20px;overflow:hidden;background:#0b1020;box-shadow:0 50px 120px -20px rgba(0,0,0,.75),0 0 0 1.5px rgba(255,255,255,.12),0 0 90px rgba(99,102,241,.25);transform-origin:0 0}
.bar{height:44px;background:linear-gradient(#1b2040,#151a38);display:flex;align-items:center;padding:0 18px;gap:9px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar b{width:13px;height:13px;border-radius:50%;display:block}
.url{margin-left:22px;flex:0 0 520px;height:26px;border-radius:13px;background:rgba(255,255,255,.08);color:#aab1d6;font-size:14px;display:flex;align-items:center;padding:0 14px}
.view{position:relative;overflow:hidden;background:#f8fafc}
.view img{position:absolute;display:block;max-width:none}
.cur{position:absolute;width:34px;height:34px;left:0;top:0;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transform-origin:4px 3px}
.rip{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid #6366f1;opacity:0}
/* chips */
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:12px 22px 12px 12px;border-radius:999px;background:rgba(255,255,255,.96);color:#111633;font-size:23px;font-weight:700;box-shadow:0 18px 50px -10px rgba(0,0,0,.55),0 0 0 1px rgba(99,102,241,.25);opacity:0;white-space:nowrap}
.chip .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.chip.green .ic{background:linear-gradient(135deg,#16a34a,#22c55e)}
.chip.dark{background:rgba(15,19,48,.92);color:#fff;box-shadow:0 18px 50px -10px rgba(0,0,0,.6),0 0 0 1px rgba(165,180,252,.35)}
.pill{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font-size:24px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#e0e7ff;opacity:0;white-space:nowrap}
.logo{width:150px;height:150px;border-radius:38px;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3);display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;box-shadow:0 30px 90px -10px rgba(99,102,241,.8),inset 0 0 0 2px rgba(255,255,255,.25)}
.big{font-size:104px;font-weight:800;letter-spacing:-.035em}
.mid{font-size:68px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:38px;font-weight:500;color:#c7d2fe}
.letter{display:inline-block}
.center{position:absolute;left:0;right:0;text-align:center}
/* cards */
.card{position:absolute;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.rolecard{width:500px;height:440px;padding:34px 36px}
.rolecard h3{font-size:38px;margin:18px 0 14px;font-weight:800;letter-spacing:-.02em}
.rolecard li{font-size:25px;color:#dbe1ff;margin:12px 0;list-style:none;padding-left:34px;position:relative;opacity:0}
.rolecard li:before{content:"";position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#86efac)}
.ricon{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.feed{position:absolute;display:flex;align-items:center;gap:18px;width:690px;padding:18px 26px;border-radius:22px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);font-size:30px;font-weight:600;opacity:0}
.feed small{margin-left:auto;font-size:20px;color:#a5b4fc;font-weight:500}
.feed .dot{width:16px;height:16px;border-radius:50%;background:#34d399;box-shadow:0 0 16px #34d399}
#progress{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#6366f1,#c084fc,#22d3ee);width:0}
#wm{position:absolute;right:46px;bottom:26px;font-size:20px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em;opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="background:#4f46e5"></div>
  <div class="blob" id="b2" style="background:#9333ea"></div>
  <div class="blob" id="b3" style="background:#0ea5e9;opacity:.35"></div>
  <div id="grid"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="scenes"></div>
  <div id="wm">FocusGuard AI</div>
  <div id="progress"></div>
  <div id="black"></div>
</div>
<script>
const W=1920,H=1080;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},soft:t=>t*t*(3-2*t)};
const PR=(t,t0,d,e=E.out)=>e(clamp((t-t0)/d));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const updaters=[];
const T={};   // scene timing from timeline.json
const WIN={x:140,y:176,w:1640,h:796,bar:44};
const ICON={
  bolt:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="2" width="4" height="19" rx="1"/></svg>',
  mail:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  user:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c.8-4.6 4.2-7 8.5-7s7.7 2.4 8.5 7z"/></svg>',
  moon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>',
  sparkle:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z"/></svg>',
  phone:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
  shield:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>',
  building:'<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6h5a1 1 0 0 1 1 1v10zM7 7h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm6 0h2v2h-2z"/></svg>'
};
const CURSOR='<svg viewBox="0 0 34 34" width="34" height="34"><path d="M4 3v22l6-5.4 4.2 9.6 4-1.8-4.2-9.4H22z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>';

/* ---------- optional AI backgrounds (Higgsfield images dropped into assets/ai/) ---------- */
const AIBG={};
function tryImage(name){return new Promise(res=>{const i=new Image();i.onload=()=>{AIBG[name]=i.src;res()};i.onerror=()=>res();i.src='assets/ai/'+name+'.jpg'})}
function aiLayer(scene,name){const d=el('div','aibg','',scene);d.dataset.ai=name;return d}
function updAI(d,t,start,dur){if(!AIBG[d.dataset.ai])return;d.style.backgroundImage='url('+AIBG[d.dataset.ai]+')';const lt=t-start;d.style.opacity=.42*PR(t,start,1)*(1-PR(t,start+dur-1,1));d.style.transform='scale('+(1.05+0.06*lt/dur)+')'}

/* ---------- background ---------- */
const bl=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')];
const fx=document.getElementById('fx').getContext('2d');
const rngP=mulberry(7);const PARTS=Array.from({length:70},()=>({x:rngP()*W,y:rngP()*H,r:1+rngP()*2.8,s:8+rngP()*26,p:rngP()*6.28,a:.12+rngP()*.4}));
function drawBg(t){
  bl[0].style.transform=`translate(${-300+Math.sin(t*.21)*260}px,${-380+Math.cos(t*.17)*160}px)`;
  bl[1].style.transform=`translate(${950+Math.cos(t*.19)*240}px,${280+Math.sin(t*.23)*200}px)`;
  bl[2].style.transform=`translate(${420+Math.sin(t*.13+2)*300}px,${620+Math.cos(t*.15)*120}px)`;
  fx.clearRect(0,0,W,H);
  for(const p of PARTS){const y=(p.y-t*p.s+H*10)%H;const x=p.x+Math.sin(t*.4+p.p)*26;fx.globalAlpha=p.a*(.6+.4*Math.sin(t*1.2+p.p));fx.fillStyle='#c7d2fe';fx.beginPath();fx.arc(x,y,p.r,0,6.283);fx.fill()}
  fx.globalAlpha=1;
}

/* ---------- scene helper ---------- */
function Scene(name,{fadeIn=.6,fadeOut=.6}={}){
  const s=T[name];const root=el('div','scene','',document.getElementById('scenes'));
  updaters.push(t=>{const o=(fadeIn?PR(t,s.start,fadeIn,E.lin):(t>=s.start?1:0))*(fadeOut?1-PR(t,s.start+s.dur-fadeOut,fadeOut,E.lin):(t<s.start+s.dur?1:0));root.style.opacity=o;root.style.display=(t>=s.start-.01&&t<=s.start+s.dur+.01)?'block':'none'});
  return {root,s,at:(rel)=>s.start+rel};
}
function words(parent,text,cls){const out=[];text.split(' ').forEach(w=>{out.push(el('span','w'+(cls?' '+cls:''),w,parent))});return out}
function reveal(e,t,t0,d=.7,y=34){const p=PR(t,t0,d);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*y}px)`}
function typeIn(e,t,t0,perChar,y=0){ /* letters */ }

/* ---------- headline + chips ---------- */
function Headline(scene,start,dur,kicker,title,{out=true}={}){
  const hend=out?.5:.9;
  const h=el('div','head','',scene.root);
  const k=el('div','kick','<i></i>'+kicker,h);
  const tt=el('div','ttl','',h);const ws=words(tt,title);
  updaters.push(t=>{const vis=t>=start-.01&&t<=start+dur+.6;h.style.display=vis?'block':'none';if(!vis)return;
    const o=1-PR(t,start+dur-hend,.4,E.lin);h.style.opacity=o;
    k.style.opacity=PR(t,start+.1,.5);k.style.transform=`translateX(${(1-PR(t,start+.1,.6))*-24}px)`;
    ws.forEach((w,i)=>{const p=PR(t,start+.25+i*.09,.6);w.style.opacity=p;w.style.transform=`translateY(${(1-p)*30}px)`;w.style.filter=`blur(${(1-p)*8}px)`})});
}
function Chip(scene,{text,icon='check',x,y,t0,t1,cls='',float=1}){
  const c=el('div','chip '+cls,`<span class="ic">${ICON[icon]}</span>${text}`,scene.root);
  c.style.left=x+'px';c.style.top=y+'px';
  updaters.push(t=>{const p=PR(t,t0,.55,E.back)*(1-PR(t,t1,.35,E.lin));c.style.opacity=clamp(p*1.4);c.style.display=t>=t0-.01&&t<=t1+.4?'flex':'none';c.style.transform=`translateY(${Math.sin(t*2.2+x)*5*float}px) scale(${.6+.4*p})`});
  return c;
}

/* ---------- app window shot ---------- */
function Shot(scene,cfg){
  // cfg: img,url,imgH,start,dur,out,cam[{t,fx,fy,Z}],cursor[{t,x,y,click}],kicker,title,extra
  const win=el('div','win','',scene.root);
  win.style.left=WIN.x+'px';win.style.top=WIN.y+'px';win.style.width=WIN.w+'px';win.style.height=(WIN.h+WIN.bar)+'px';
  el('div','bar',`<b style="background:#ff5f57"></b><b style="background:#febc2e"></b><b style="background:#28c840"></b><div class="url">${cfg.url}</div>`,win);
  const view=el('div','view','',win);view.style.width=WIN.w+'px';view.style.height=WIN.h+'px';
  const img=el('img','','',view);img.src='shots/'+cfg.img+'.png';
  const cur=el('div','cur',CURSOR,view);
  const rips=(cfg.cursor||[]).filter(k=>k.click).map(k=>{const r=el('div','rip','',view);return {r,k}});
  const imgW=1440;
  function cam(lt){const K=cfg.cam;if(lt<=K[0].t)return K[0];for(let i=0;i<K.length-1;i++){if(lt<=K[i+1].t){const p=E.io(clamp((lt-K[i].t)/(K[i+1].t-K[i].t)));return {fx:lerp(K[i].fx,K[i+1].fx,p),fy:lerp(K[i].fy,K[i+1].fy,p),Z:lerp(K[i].Z,K[i+1].Z,p)}}}return K[K.length-1]}
  if(cfg.head!==false) Headline(scene,cfg.start,cfg.dur,cfg.kicker,cfg.title,{out:cfg.out!==false});
  updaters.push(t=>{
    const lt=t-cfg.start;const vis=lt>=-.01&&lt<=cfg.dur+.7;win.style.display=vis?'block':'none';if(!vis)return;
    const pin=PR(t,cfg.start,.7);const pout=cfg.out===false?0:PR(t,cfg.start+cfg.dur-.5,.5,E.lin);
    win.style.opacity=pin*(1-pout);
    let tx=0,ty=(1-pin)*46,sc=.94+.06*pin;
    if(cfg.extra){const r=cfg.extra(t,lt);if(r){tx=r.tx||0;ty+=r.ty||0;sc*=r.sc||1}}
    win.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
    const c=cam(lt);const iw=imgW*c.Z;
    const left=clamp(WIN.w/2-c.fx*c.Z,WIN.w-iw,0);const top=clamp(WIN.h/2-c.fy*c.Z,WIN.h-cfg.imgH*c.Z,0);
    img.style.width=iw+'px';img.style.left=left+'px';img.style.top=top+'px';
    if(cfg.cursor){const K=cfg.cursor;let x,y;
      if(lt<K[0].t){x=K[0].x;y=K[0].y}else if(lt>=K[K.length-1].t){x=K[K.length-1].x;y=K[K.length-1].y}else{for(let i=0;i<K.length-1;i++)if(lt<=K[i+1].t){const p=E.io(clamp((lt-K[i].t)/(K[i+1].t-K[i].t)));x=lerp(K[i].x,K[i+1].x,p);y=lerp(K[i].y,K[i+1].y,p);break}}
      const vis2=PR(lt,K[0].t-.3,.3,E.lin)*(1-PR(lt,K[K.length-1].t+.9,.4,E.lin));
      let press=1;rips.forEach(({k})=>{const d=lt-k.t;if(d>0&&d<.18)press=.84});
      cur.style.opacity=vis2;cur.style.transform=`translate(${left+x*c.Z}px,${top+y*c.Z}px) scale(${press})`;
      rips.forEach(({r,k})=>{const d=lt-k.t;if(d>0&&d<.75){const p=d/.75;r.style.opacity=1-p;r.style.left=(left+k.x*c.Z)+'px';r.style.top=(top+k.y*c.Z)+'px';r.style.transform=`scale(${.4+p*2.2})`}else r.style.opacity=0})}
  });
  return win;
}

/* ================= SCENES ================= */
function buildAll(){
/* ---- 1. INTRO ---- */
{const sc=Scene('intro',{fadeIn:0});const S=T.intro.start;const ai=aiLayer(sc.root,'intro');
 const logo=el('div','logo','F',sc.root);logo.style.position='absolute';logo.style.left='885px';logo.style.top='250px';
 const name=el('div','center big','',sc.root);name.style.top='450px';
 const letters='FocusGuard AI'.split('').map(ch=>el('span','letter',ch===' '?'&nbsp;':ch,name));
 const tag=el('div','center sub','Human attention, <span class="grad" style="font-weight:700">measured and improved.</span>',sc.root);tag.style.top='600px';
 const pills=['Real-time tracking','AI insights','Team analytics'].map((x,i)=>{const p=el('div','pill',x,sc.root);return p});
 const px=[470,820,1135];pills.forEach((p,i)=>{p.style.top='730px';p.style.left=px[i]+'px'});
 updaters.push(t=>{updAI(ai,t,S,T.intro.dur);const lt=t-S;
   // converging rings
   if(lt>=0&&lt<4)for(let i=0;i<7;i++){const p=clamp((lt-i*.18)/2.2);const r=lerp(980,92,E.out(p));const a=(1-Math.abs(p-.5)*2)*.5*(lt<2.6?1:1-PR(lt,2.6,.8));fx.globalAlpha=Math.max(0,a);fx.strokeStyle=i%2?'#818cf8':'#c084fc';fx.lineWidth=2+i*.3;fx.beginPath();fx.arc(960,325,r,0,6.283);fx.stroke()}
   fx.globalAlpha=1;
   const lp=PR(lt,1.5,1.0,E.back);logo.style.opacity=clamp(lp*1.5);logo.style.transform=`scale(${.3+.7*lp}) rotate(${(1-lp)*-25}deg)`;
   letters.forEach((l,i)=>{const p=PR(lt,2.2+i*.06,.55);l.style.opacity=p;l.style.transform=`translateY(${(1-p)*44}px)`;l.style.filter=`blur(${(1-p)*10}px)`});
   reveal(tag,lt,3.4,.8,28);pills.forEach((p,i)=>{const q=PR(lt,4.5+i*.25,.6,E.back);p.style.opacity=clamp(q*1.5);p.style.transform=`scale(${.7+.3*q})`});
 });}

/* ---- 2. PROBLEM ---- */
{const sc=Scene('problem');const S=T.problem.start;const ai=aiLayer(sc.root,'problem');
 const l1=el('div','center mid','Every day, <span class="grad">attention leaks.</span>',sc.root);l1.style.top='120px';
 const defs=[{t:'Endless tabs',c:'#f97316',x:330},{t:'Social feeds',c:'#ec4899',x:760},{t:'Notifications',c:'#eab308',x:1190}];
 const dcards=defs.map(d=>{const c=el('div','card','',sc.root);c.style.cssText+=`;width:400px;height:240px;left:${d.x}px;top:400px;padding:34px`;c.innerHTML=`<div style="width:70px;height:70px;border-radius:20px;background:${d.c};box-shadow:0 12px 40px ${d.c}88"></div><div style="font-size:40px;font-weight:700;margin-top:24px">${d.t}</div>`;return c});
