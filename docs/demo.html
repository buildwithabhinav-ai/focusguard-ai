<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusGuard AI demo</title>
  <meta name="description" content="Product tour of FocusGuard AI: activity tracking, analytics, planner, AI insights and multi-language UI.">
  <style>
    :root {
      --bg: #0f0d2e;
      --ink: #ffffff;
      --muted: #c7d2fe;
      --brand: #4f46e5;
      --accent: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(139, 92, 246, .45), transparent 60%),
        radial-gradient(700px 400px at -10% 110%, rgba(250, 204, 21, .14), transparent 60%),
        var(--bg);
    }
    main { width: 100%; max-width: 1040px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.25rem); letter-spacing: -.01em; }
    p { margin: 0 0 20px; color: var(--muted); }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .12);
    }
    a.back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--accent);
      color: #1e1b4b;
      font-weight: 600;
      text-decoration: none;
    }
    a.back:hover { filter: brightness(1.06); }
    a.back:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>FocusGuard AI demo</h1>
    <p>A quick tour of tracking, analytics, the focus planner, AI insights and the multi-language interface.</p>
    <video controls preload="metadata" playsinline poster="assets/demo-poster.jpg">
      <source src="../focusguard-ui/public/demo/focusguard-demo.mp4" type="video/mp4">
      Your browser can't play this video. <a href="../focusguard-ui/public/demo/focusguard-demo.mp4">Download it instead.</a>
    </video>
    <a class="back" href="https://github.com/buildwithabhinav-ai/focusguard-ai">Back to the repository</a>
  </main>
</body>
</html>
