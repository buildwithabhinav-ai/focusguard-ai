<svg xmlns="http://www.w3.org/2000/svg" width="720" height="48" viewBox="0 0 720 48" role="img" aria-label="Track your attention. Plan your focus. Ask your own data.">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.6" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="url(#t)">
    <text x="360" y="33" opacity="1">Track your attention.
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.62;0.66;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="360" y="33" opacity="0">Plan your focus.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.62;0.68;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="360" y="33" opacity="0">Ask your own data.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
